<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Justin's Hub</title>
        <link rel="stylesheet" href="indexStyles.css">
    </head>
    <body class="LoginBody">
        <div class="template">
            <main>
                <p class="line1">Welcome to Stellaz</p>
                <div class="loginImage"></div>
                <div class="inputContainers">
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="inputContainers">
                    <input type="password" id="password" placeholder="password">
                </div>
                <div class="showPasswordLabel">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>
                <div class="buttons">
                    <button type="button" id="loginButton">Login</button>
                </div>
                <div class="buttons">
                    <button type="button" id="portfolioButton">Justin's Portfolio</button>
                </div>
                <div class="buttons">
                    <button type="button" id="security_robot">Security Robot</button>
                </div>
                
            </main>
        </div>
        <dialog id="signupDialog" class="signupDialog">
            <form id="signupForm">
                <button type="button" id="closeSignupButton" class="signupClose" aria-label="Close">×</button>
                <h2>Create Stellaz Account</h2>
                <p class="signupIntro">You need an invite key from Justin to create an account.</p>
                <div class="signupField">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" autocomplete="email" required>
                </div>
                <div class="signupField">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="signupField">
                    <label for="signupConfirmPassword">Confirm password</label>
                    <input type="password" id="signupConfirmPassword" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="signupField">
                    <label for="signupInviteKey">Invite key</label>
                    <input type="text" id="signupInviteKey" autocomplete="off" required>
                </div>
                <p id="signupMessage" class="signupMessage" aria-live="polite"></p>
                <button type="submit" id="createAccountButton" class="createAccountButton">Create Account</button>
            </form>
        </dialog>

        <script type="module" src="index.js?v=3"></script>
    </body>
</html>
